admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
  - name: machine
    address:
      socket_address: { address: 0.0.0.0, port_value: 8181 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: machine
          use_remote_address: false
          route_config:
            name: outbound
            virtual_hosts:
            - name: protected
              domains: ["protected.test"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: upstream, timeout: 0s }
                typed_per_filter_config:
                  envoy.filters.http.dynamic_modules/spire_jwt:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
                    filter_name: spire_jwt
                    dynamic_module_config: { name: spire_jwt }
                    filter_config:
                      "@type": type.googleapis.com/google.protobuf.StringValue
                      value: |
                        {"enabled": true, "audience": "reporter-service"}
            - name: bad_audience
              domains: ["bad-audience.test"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: upstream, timeout: 0s }
                typed_per_filter_config:
                  envoy.filters.http.dynamic_modules/spire_jwt:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
                    filter_name: spire_jwt
                    dynamic_module_config: { name: spire_jwt }
                    filter_config:
                      "@type": type.googleapis.com/google.protobuf.StringValue
                      value: |
                        {"enabled": true, "audience": "not-allowed"}
            - name: open
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: upstream, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.dynamic_modules/spire_jwt
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              filter_name: spire_jwt
              dynamic_module_config:
                name: spire_jwt
                metrics_namespace: spire_jwt
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "workloadApiCluster": "spire_agent_workload_api",
                    "expectedSpiffeId": "spiffe://infra.agrd.dev/environment/dev/service/reporter",
                    "audiences": ["reporter-service"],
                    "headerName": "x-agrd-machine",
                    "refreshMarginSeconds": 60,
                    "minRemainingSeconds": 30,
                    "fetchTimeoutMs": 500,
                    "retryInitialBackoffMs": 200,
                    "retryMaxBackoffMs": 2000,
                    "maxPendingRequests": 128
                  }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: spire_agent_workload_api
    type: STATIC
    connect_timeout: 0.5s
    load_assignment:
      cluster_name: spire_agent_workload_api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe: { path: /run/spire/agent.sock }
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}

  - name: upstream
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: upstream
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8080 }
