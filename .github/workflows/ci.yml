name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Unit tests
        run: |
          docker buildx build \
            --target test \
            --cache-from type=gha,scope=test \
            --cache-to type=gha,mode=max,scope=test \
            .

      - name: End-to-end tests
        run: |
          docker buildx build \
            --target e2e \
            --cache-from type=gha,scope=e2e \
            --cache-to type=gha,mode=max,scope=e2e \
            .
