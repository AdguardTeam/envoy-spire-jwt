# Example Envoy configuration for agrd.filters.http.spire_jwt.
#
# The filter is a dynamic module that lives in this image at
# /usr/local/lib/envoy-spire-jwt/libspire_jwt.so. The image sets
# ENVOY_DYNAMIC_MODULES_SEARCH_PATH, so `name: spire_jwt` resolves to that file.
#
# Socket path: the SPIRE Agent publishes its Workload API on a hostPath. The
# operator mounts /run/spire/agent-sockets into this container. A dynamic module
# cannot open sockets itself, so the socket lives in a cluster definition and the
# filter only names the cluster.

admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
  - name: machine
    address:
      socket_address: { address: 0.0.0.0, port_value: 8181 }
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: machine
          use_remote_address: false
          route_config:
            name: outbound
            virtual_hosts:
            # Protected route. Only this vhost has a per-route config that sets
            # enabled: true, so no other route can receive a machine credential.
            - name: reporter-service
              domains:
              - reporter-service.dev.svc.cluster.local
              - reporter-service.dev.svc.cluster.local:8181
              routes:
              - match: { prefix: "/" }
                route: { cluster: reporter_service, timeout: 0s }
                typed_per_filter_config:
                  envoy.filters.http.dynamic_modules/spire_jwt:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilterPerRoute
                    filter_name: spire_jwt
                    dynamic_module_config: { name: spire_jwt }
                    filter_config:
                      "@type": type.googleapis.com/google.protobuf.StringValue
                      value: |
                        {"enabled": true, "audience": "reporter-service"}
            # Everything else is forwarded without a machine credential.
            - name: default
              domains: ["*"]
              routes:
              - match: { prefix: "/" }
                route: { cluster: local_app, timeout: 0s }
          http_filters:
          - name: envoy.filters.http.dynamic_modules/spire_jwt
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_modules.v3.DynamicModuleFilter
              filter_name: spire_jwt
              dynamic_module_config:
                name: spire_jwt
                metrics_namespace: spire_jwt
              filter_config:
                "@type": type.googleapis.com/google.protobuf.StringValue
                value: |
                  {
                    "workloadApiCluster": "spire_agent_workload_api",
                    "expectedSpiffeId": "spiffe://infra.agrd.dev/environment/dev/service/reporter",
                    "audiences": ["reporter-service"],
                    "refreshMarginSeconds": 60,
                    "minRemainingSeconds": 30,
                    "maxTokenLifetimeSeconds": 0,
                    "fetchTimeoutMs": 500,
                    "retryInitialBackoffMs": 200,
                    "retryMaxBackoffMs": 5000,
                    "maxPendingRequests": 128
                  }
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # The Workload API. HTTP/2 over a Unix domain socket, reachable only from this
  # pod. Never expose this cluster to a route.
  - name: spire_agent_workload_api
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: spire_agent_workload_api
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              pipe: { path: /run/spire/agent-sockets/spire-agent.sock }
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}

  - name: reporter_service
    type: STRICT_DNS
    connect_timeout: 1s
    load_assignment:
      cluster_name: reporter_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: reporter-service.dev.svc.cluster.local, port_value: 8181 }

  - name: local_app
    type: STATIC
    connect_timeout: 1s
    load_assignment:
      cluster_name: local_app
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address: { address: 127.0.0.1, port_value: 8191 }
